pre-commit:
  jobs:
    - run: pnpm dlx ultracite fix
      glob: 
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.json"
        - "*.jsonc"
        - "*.css"
      stage_fixed: true
    - run: pnpm prettier --write
      glob:
        - "src/contents/**/*.md"
        - "src/contents/**/*.mdx"
      stage_fixed: true